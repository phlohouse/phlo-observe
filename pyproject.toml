[project]
name = "phlo-observe-dev"
version = "0.0.0"
description = "Workspace root for phlo-observe (development tooling only)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "jsonschema>=4.23",
    "respx>=0.22",
    "httpx>=0.28",
    "ruff>=0.8",
    "ty>=0.0.1a16",
    "uv-build>=0.8",
    "pydantic-settings>=2.6",
    "orjson>=3.10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
observe-core = { workspace = true }
phlo-observe = { workspace = true }
phlo-observer = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations", ".venv", "node_modules", "site"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF",
    "ASYNC", "PTH", "RET", "DTZ", "S", "A", "PERF", "G",
    "LOG", "ANN", "D", "PLC", "PLE", "PLW",
]
ignore = [
    "ANN401",   # Any is acceptable in serialization boundaries
    "D107",     # __init__ does not need its own docstring
    "D203",     # conflicts with D211
    "D213",     # conflicts with D212
    "PLW2901",  # loop variable reuse is fine in tests/fixtures
]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D", "ANN", "S105", "S106", "S108", "DTZ001", "PLC0415", "PLW1510", "S603"]
"**/conftest.py" = ["D", "ANN"]
"examples/**" = ["D", "ANN", "S"]
"**/migrations/**" = ["D", "ANN"]
"docs/**" = ["D", "S"]
"**/cli.py" = ["PLC0415"]
"**/app.py" = ["B008"]
"**/auth.py" = ["B008"]

[tool.ty.src]
include = ["packages/*/src", "services/*/src", "tests", "examples"]

[tool.ty.environment]
python = ".venv"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unresolved-import = "error"

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error", "ignore::DeprecationWarning:websockets.*", "ignore::DeprecationWarning:uvicorn.*"]
markers = [
    "integration: tests requiring external services (postgres)",
    "performance: performance benchmarks",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["packages/observe-core/src", "packages/phlo-observe-sdk/src", "services/phlo-observer/src"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.hatch.build.targets.wheel]
packages = []
