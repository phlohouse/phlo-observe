name: release-observer

# Observer image release (spec §5/§87): builds and publishes the
# phlo-observer container image on phlo-observer version tags. Tags are
# created by ReleaseX as `phlo-observer/v<version>` — pushed with
# GITHUB_TOKEN, which cannot trigger tag workflows, so release-python
# dispatches this workflow with the tag after `relx release tag`.

on:
  push:
    tags: ["phlo-observer/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. phlo-observer/v0.1.0)
        required: true
        type: string
      latest:
        description: Also update the :latest image tag
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build + push observer image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve release version and image tags
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          WANT_LATEST: ${{ github.event_name == 'push' || inputs.latest }}
        run: |
          # Tag name is `phlo-observer/v<version>`; the image tag is the version.
          repo="ghcr.io/${GITHUB_REPOSITORY,,}/phlo-observer"
          {
            echo "version=${RELEASE_TAG##*/}"
            echo "tags<<EOF"
            echo "$repo:${RELEASE_TAG##*/}"
            [ "$WANT_LATEST" = "true" ] && echo "$repo:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push observer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/phlo-observer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
