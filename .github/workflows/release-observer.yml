name: release-observer

# Observer image release (spec §5/§87): builds and publishes the
# phlo-observer container image on phlo-observer version tags.

on:
  push:
    tags: ["phlo-observer-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build + push observer image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (+push on tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/phlo-observer/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}/phlo-observer:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/phlo-observer:latest
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
