name: release-python

# Release automation via ReleaseX (relx): on every push to main, relx opens or
# updates a single release PR covering every changed package (monorepo
# release_set mode, configured in relx.toml). When a release PR merges, its
# squash commit title (`chore(release): ...`) switches the run to
# `relx release tag`, which creates the `<package>/v<version>` tags and GitHub
# Releases from the committed .relx/release-manifest.json.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write  # dispatch release-observer for image builds
  contents: write
  pull-requests: write

concurrency:
  group: relx-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: release PR / tag
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      publish_phlo_observe_core: ${{ steps.packages.outputs.phlo_observe_core }}
      publish_phlo_observe_query: ${{ steps.packages.outputs.phlo_observe_query }}
      publish_phlo_observe: ${{ steps.packages.outputs.phlo_observe }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # relx refreshes uv.lock when it bumps package versions.
      - uses: jdx/mise-action@v2

      - name: Install relx for the pending-release check
        run: |
          curl -fsSL -o "$RUNNER_TEMP/relx" \
            "https://github.com/iamgp/ReleaseX/releases/latest/download/relx-x86_64-unknown-linux-musl"
          chmod +x "$RUNNER_TEMP/relx"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Decide release action
        id: check
        run: |
          msg="$(git log -1 --format='%s')"
          if echo "$msg" | grep -qP '^chore\(release\):'; then
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            pending="$(relx status --json | jq -r '[.packages[]? | select(.selected == true)] | length')"
            if [ "$pending" -gt 0 ]; then
              echo "mode=pr" >> "$GITHUB_OUTPUT"
            else
              echo "mode=noop" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Identify Python packages in the release
        id: packages
        run: |
          selected() {
            jq -r --arg name "$1" \
              'any(.packages[]?; .name == $name and .selected)' \
              .relx/release-manifest.json
          }
          echo "phlo_observe_core=$(selected phlo-observe-core)" >> "$GITHUB_OUTPUT"
          echo "phlo_observe_query=$(selected phlo-observe-query)" >> "$GITHUB_OUTPUT"
          echo "phlo_observe=$(selected phlo-observe)" >> "$GITHUB_OUTPUT"

      - name: Tag merged release PR
        if: steps.check.outputs.mode == 'tag'
        uses: iamgp/ReleaseX@v1.9.4
        with:
          command: release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # relx pushes tags with GITHUB_TOKEN, which cannot trigger the
      # release-observer tag workflow — dispatch it explicitly instead.
      - name: Dispatch observer image release
        if: steps.check.outputs.mode == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(jq -r '.packages[]? | select(.name == "phlo-observer") | .release_tag' .relx/release-manifest.json)"
          if [ -n "$tag" ]; then
            gh workflow run release-observer.yml -f "tag=$tag"
            echo "Dispatched release-observer for $tag"
          else
            echo "No phlo-observer release in manifest; skipping image build."
          fi

      - name: Create or update release PRs
        if: steps.check.outputs.mode == 'pr'
        uses: iamgp/ReleaseX@v1.9.4
        with:
          command: release pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Nothing releasable
        if: steps.check.outputs.mode == 'noop'
        run: echo "No releasable package changes pending on main."

  build-python:
    name: build + verify Python distributions
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.mode == 'tag'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Build publishable packages
        run: |
          uv build --package phlo-observe-core --out-dir dist/phlo-observe-core
          uv build --package phlo-observe-query --out-dir dist/phlo-observe-query
          uv build --package phlo-observe --out-dir dist/phlo-observe
      - name: Verify distribution metadata
        run: |
          uvx --from twine twine check dist/phlo-observe-core/*
          uvx --from twine twine check dist/phlo-observe-query/*
          uvx --from twine twine check dist/phlo-observe/*
      - uses: actions/upload-artifact@v4
        with:
          name: phlo-observe-core-dist
          path: dist/phlo-observe-core
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: phlo-observe-query-dist
          path: dist/phlo-observe-query
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: phlo-observe-dist
          path: dist/phlo-observe
          if-no-files-found: error
          retention-days: 1

  publish-phlo-observe-core:
    name: publish phlo-observe-core to PyPI
    runs-on: ubuntu-latest
    needs: [release, build-python]
    if: needs.release.outputs.publish_phlo_observe_core == 'true'
    environment:
      name: pypi-core
      url: https://pypi.org/p/phlo-observe-core
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phlo-observe-core-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-phlo-observe-query:
    name: publish phlo-observe-query to PyPI
    runs-on: ubuntu-latest
    needs: [release, build-python]
    if: needs.release.outputs.publish_phlo_observe_query == 'true'
    environment:
      name: pypi-query
      url: https://pypi.org/p/phlo-observe-query
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phlo-observe-query-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-phlo-observe:
    name: publish phlo-observe to PyPI
    runs-on: ubuntu-latest
    needs: [release, build-python]
    if: needs.release.outputs.publish_phlo_observe == 'true'
    environment:
      name: pypi-sdk
      url: https://pypi.org/p/phlo-observe
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phlo-observe-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
