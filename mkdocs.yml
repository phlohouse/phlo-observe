site_name: phlo-observe
site_description: Coherent observability for Phlo and related Python applications
repo_url: https://github.com/phlohouse/phlo-observe

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.indexes

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - mermaid2

nav:
  - Home: index.md
  - Specification: V1_SPEC.md
  - Architecture: architecture.md
  - Event model: event-model.md
  - Configuration: configuration.md
  - Integrations: integrations.md
  - Deployment: deployment.md
  - Troubleshooting: troubleshooting.md

plugins:
  - search
