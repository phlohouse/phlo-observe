[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.8,<0.13"]

[project]
dependencies = [
    "phlo-observe-core[otlp]",
    "phlo-observe",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "orjson>=3.10",
    "typer>=0.12",
]
description = "Central ingestion, normalization, correlation, persistence and query service for phlo-observe."
name = "phlo-observer"
readme = "README.md"
requires-python = ">=3.12"
version = "0.2.3"

[[project.authors]]
name = "Phlo"

[project.license]
text = "Apache-2.0"

[project.scripts]
phlo-observer = "phlo_observer.cli:main"

[tool.uv.build-backend]
module-name = "phlo_observer"
module-root = "src"

[tool.uv.sources.phlo-observe]
workspace = true

[tool.uv.sources.phlo-observe-core]
workspace = true
