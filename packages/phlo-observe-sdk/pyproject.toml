[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.8,<0.13"]

[project]
dependencies = [
    "observe-core",
    "observe-query",
    "pydantic>=2.8",
]
description = "Phlo-specific observability SDK: domain contexts, typed event attributes and integrations for Dagster, dbt, DLT, Pandera, WAP, Iceberg/Nessie and Trino."
name = "phlo-observe"
readme = "README.md"
requires-python = ">=3.12"
version = "0.2.1"

[[project.authors]]
name = "Phlo"

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
all = ["phlo-observe[dagster,dbt,dlt,pandera,trino]"]
dagster = ["dagster>=1.8"]
dbt = []
dlt = ["dlt>=1.0"]
pandera = ["pandera>=0.20"]
trino = ["trino>=0.330"]

[project.scripts]
phlo-observe = "phlo_observe.cli:main"

[tool.uv.build-backend]
module-name = "phlo_observe"
module-root = "src"

[tool.uv.sources.observe-core]
workspace = true

[tool.uv.sources.observe-query]
workspace = true
