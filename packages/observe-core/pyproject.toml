[project]
name = "observe-core"
version = "0.0.0"
description = "Generic wide-event observability: operation-scoped events, context propagation, redaction, async emission and pluggable drains."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Phlo" }]
dependencies = [
    "orjson>=3.10",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
otlp = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
all = ["observe-core[otlp]"]

[project.scripts]
observe = "observe_core.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "observe_core"
