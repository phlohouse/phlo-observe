[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.8,<0.13"]

[project]
dependencies = [
    "orjson>=3.10",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]
description = "Generic wide-event observability: operation-scoped events, context propagation, redaction, async emission and pluggable drains."
name = "phlo-observe-core"
readme = "README.md"
requires-python = ">=3.12"
version = "0.3.1"

[[project.authors]]
name = "Phlo"

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
all = ["phlo-observe-core[otlp]"]
otlp = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
observe = "observe_core.cli:main"

[tool.uv.build-backend]
module-name = "observe_core"
module-root = "src"
