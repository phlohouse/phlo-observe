# OTel Collector: receive OTLP, forward to phlo-observer.
# Enabled via `docker compose --profile otel up`.
#
# The observer's /v1/ingest/otlp endpoint accepts OTLP *JSON* log payloads —
# `encoding: json` on the otlphttp exporter is required (the default protobuf
# encoding is not accepted by the JSON ingest API).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlphttp/phlo:
    # Each OTLP logs batch is normalized as an `external.source_event` event.
    endpoint: http://phlo-observer:8080
    logs_endpoint: http://phlo-observer:8080/v1/ingest/otlp
    encoding: json
    headers:
      Authorization: Bearer ${env:PHLO_OBSERVER_INGEST_TOKEN}
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 30s
      max_elapsed_time: 5m

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/phlo]
